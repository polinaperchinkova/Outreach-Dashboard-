name: Update Outreach Dashboard

on:
  schedule:
    # Every Friday at 07:00 UTC (09:00 Skopje). GitHub may delay cron a few minutes.
    - cron: '0 7 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Build data.json from Apollo
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: python update_dashboard.py

      - name: Commit and push updated data
        run: |
          git config user.name "Dashboard Bot"
          git config user.email "bot@datamasters.co"
          git add data.json index.html
          git diff --staged --quiet || git commit -m "Auto-update dashboard $(date '+%Y-%m-%d')"
          git push
