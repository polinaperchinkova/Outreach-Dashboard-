<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataMasters — Outreach Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0b0f1a; --panel:#131a2b; --panel2:#1a2338; --line:#243049;
    --ink:#eef2fb; --muted:#8a96b2; --faint:#5c6683;
    --brand:#5b8def; --brand2:#7c5cff; --good:#34d399; --warn:#fbbf24; --bad:#f87171;
    --chip:#1e2740;
    --r:14px; --shadow:0 2px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--brand);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 16px 60px}

  /* Header */
  header.top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:42px;height:42px;border-radius:11px;background:#fff;
    display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);overflow:hidden}
  .logo img{width:32px;height:32px;object-fit:contain}
  .brand h1{font-size:18px;margin:0;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}
  .updated{font-size:12px;color:var(--faint);text-align:right}
  .updated b{color:var(--muted);font-weight:600}

  /* Tabs */
  nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 22px;border-bottom:1px solid var(--line)}
  nav.tabs button{background:none;border:none;color:var(--muted);font-size:14px;font-weight:600;
    padding:11px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}

  .page{display:none;animation:fade .25s ease}
  .page.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Period toggle */
  .ptoggle{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin-bottom:18px}
  .ptoggle button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer}
  .ptoggle button.on{background:var(--brand);color:#fff}

  /* KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;position:relative;overflow:hidden}
  .kpi .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);font-weight:700}
  .kpi .val{font-size:28px;font-weight:800;margin:6px 0 2px;letter-spacing:-.5px}
  .kpi .sub{font-size:12px;color:var(--muted)}
  .kpi.accent .val{color:var(--brand)}
  .kpi.good .val{color:var(--good)}
  .kpi::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(91,141,239,.12),transparent 70%)}

  /* Panels + charts */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .panel h3{margin:0 0 4px;font-size:14px;font-weight:700}
  .panel .ph-sub{font-size:12px;color:var(--muted);margin:0 0 14px}
  .chartbox{position:relative;height:260px}
  .chartbox.sm{height:220px}

  /* Table */
  .tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .filters select,.filters input{background:var(--bg);border:1px solid var(--line);color:var(--ink);
    border-radius:9px;padding:8px 10px;font-size:13px;font-family:inherit}
  .filters input{min-width:180px}
  .filters .count{margin-left:auto;font-size:12px;color:var(--muted)}
  .filters .reset{background:var(--chip);border:1px solid var(--line);color:var(--muted);border-radius:9px;padding:8px 12px;font-size:12px;cursor:pointer;font-weight:600}
  .tscroll{overflow-x:auto;max-height:640px;overflow-y:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
  thead th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:11px 12px;font-size:11px;
    text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line);user-select:none}
  thead th:hover{color:var(--ink)}
  thead th .arr{opacity:.35;font-size:10px;margin-left:3px}
  thead th.sorted .arr{opacity:1;color:var(--brand)}
  tbody td{padding:10px 12px;border-bottom:1px solid rgba(36,48,73,.5);white-space:nowrap}
  tbody tr:hover{background:rgba(91,141,239,.05)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .seqname{white-space:normal;min-width:240px;font-weight:600}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.active{background:rgba(52,211,153,.15);color:var(--good)}
  .pill.paused{background:rgba(138,150,178,.15);color:var(--muted)}
  .pill.region{background:var(--chip);color:#a9b7da}
  .pill.ind{background:rgba(124,92,255,.14);color:#b3a0ff}
  /* step progress */
  .prog{display:flex;align-items:center;gap:8px;min-width:150px}
  .progbar{flex:1;height:7px;background:var(--bg);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
  .progfill{height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:4px}
  .progtxt{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
  .dot.running{background:var(--good)}.dot.completed{background:var(--brand)}
  .dot.paused{background:var(--muted)}.dot.not_started{background:var(--warn)}

  /* step page */
  .steprow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid rgba(36,48,73,.6)}
  .steprow:last-child{border-bottom:none}
  .stepnum{width:40px;height:40px;border-radius:11px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--brand);flex-shrink:0}
  .stepmeta{flex:1;min-width:0}
  .stepmeta .n{font-weight:700;font-size:14px}
  .stepmeta .d{font-size:12px;color:var(--muted)}
  .stepbars{display:flex;gap:18px;flex-shrink:0;text-align:right}
  .stepbars .sb{min-width:66px}
  .stepbars .sb .v{font-size:17px;font-weight:800}
  .stepbars .sb .k{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);font-weight:700}

  /* insight cards */
  .insight{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
  .insight h3{margin:0 0 2px;font-size:14px}
  .insight .ih{font-size:12px;color:var(--muted);margin:0 0 14px}
  .ilist{display:flex;flex-direction:column;gap:9px}
  .irow{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);border-radius:10px;border:1px solid var(--line)}
  .irow .rank{width:22px;height:22px;border-radius:7px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0}
  .irow .rank.top{background:var(--brand);color:#fff}
  .irow .main{flex:1;min-width:0}
  .irow .main .t{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis}
  .irow .main .s{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .irow .metric{text-align:right;flex-shrink:0}
  .irow .metric .mv{font-weight:800;font-size:15px}
  .irow .metric .mk{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:.4px}
  .irow .metric.good .mv{color:var(--good)}
  .badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted);margin-left:6px}

  .note{font-size:12px;color:var(--faint);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 13px;margin-bottom:16px;display:flex;gap:8px}
  .note b{color:var(--muted)}
  .sechead{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);font-weight:800;margin:26px 0 12px}
  footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);text-align:center}
  .loading{text-align:center;padding:80px 20px;color:var(--muted)}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 14px}
  @keyframes sp{to{transform:rotate(360deg)}}

  @media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr}}
  @media(max-width:560px){.kpi .val{font-size:23px}.filters input{min-width:130px;flex:1}}
</style>
</head>

    </div>
    <div class="updated">Last updated<br><b id="updated">—</b></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="sequences">Sequences</button>
    <button data-tab="steps">Email Steps</button>
    <button data-tab="insights">Insights</button>
  </nav>

  <div id="root"><div class="loading"><div class="spin"></div>Loading Apollo data…</div></div>
</div>

<script>
let DATA=null, period='ytd';
let fRegion='', fIndustry='', fStatus='', fSearch='';
let sortCol='del', sortAsc=false;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>(v==null?0:v).toLocaleString();
const pct=(a,b)=>b>0?((a/b*100).toFixed(1)+'%'):'—';

fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;init();})
  .catch(e=>{$('root').innerHTML='<div class="loading">Could not load data.json<br><small>'+esc(e.message)+'</small></div>';});

function init(){
  $('updated').textContent=DATA.generated_date||DATA.generated||'—';
  document.querySelectorAll('#tabs button').forEach(b=>{
    b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');render(b.dataset.tab);};
  });
  render('overview');
}

function render(tab){
  const r=$('root');
  if(tab==='overview') r.innerHTML=overviewHTML();
  else if(tab==='sequences') r.innerHTML=seqHTML();
  else if(tab==='steps') r.innerHTML=stepsHTML();
  else if(tab==='insights') r.innerHTML=insightsHTML();
  r.innerHTML+=footerHTML();
  if(tab==='overview') drawOverview();
  if(tab==='steps') drawSteps();
  if(tab==='insights') drawInsights();
  if(tab==='sequences') wireFilters();
}

/* ---------- OVERVIEW ---------- */
function kpiData(){
  const t=DATA.totals, k=DATA.kpis;
  if(period==='sep') return {sent:k.sep.sent,del:k.sep.delivered,opn:k.sep.opened,clk:k.sep.clicked,rep:k.sep.replied,dem:(t.demos_sep!=null?t.demos_sep:t.demos_mtd),label:'September 2026'};
  if(period==='oct') return {sent:k.oct.sent,del:k.oct.delivered,opn:k.oct.opened,clk:k.oct.clicked,rep:k.oct.replied,dem:(t.demos_oct!=null?t.demos_oct:0),label:'October 2026 (MTD)'};
  return {sent:k.ytd.sent,del:k.ytd.delivered,opn:k.ytd.opened,clk:k.ytd.clicked,rep:k.ytd.replied,dem:t.demos_ytd,label:'Year to date 2026'};
}
function overviewHTML(){
  const c=DATA.counts;
  const k=kpiData();
  return `
  <div class="ptoggle" id="pt">
    <button data-p="ytd" class="${period==='ytd'?'on':''}">Year to date</button>
    <button data-p="sep" class="${period==='sep'?'on':''}">September</button>
    <button data-p="oct" class="${period==='oct'?'on':''}">October (MTD)</button>
  </div>
  <div class="kpis">
    <div class="kpi accent"><div class="lbl">Emails Sent</div><div class="val">${n(k.sent)}</div><div class="sub">${k.label}</div></div>
    <div class="kpi"><div class="lbl">Delivered</div><div class="val">${n(k.del)}</div><div class="sub">${pct(k.del,k.sent)} of sent</div></div>
    <div class="kpi"><div class="lbl">Opened</div><div class="val">${n(k.opn)}</div><div class="sub">${pct(k.opn,k.del)} open rate</div></div>
    <div class="kpi"><div class="lbl">Clicked</div><div class="val">${n(k.clk)}</div><div class="sub">${pct(k.clk,k.del)} click rate</div></div>
    <div class="kpi"><div class="lbl">Replied</div><div class="val">${n(k.rep)}</div><div class="sub">${pct(k.rep,k.del)} reply rate</div></div>
    <div class="kpi good"><div class="lbl">Demos Booked</div><div class="val">${n(k.dem)}</div><div class="sub">${period==='ytd'?DATA.totals.demos_alltime+' all-time':period==='oct'&&DATA.totals.interested_oct?DATA.totals.interested_oct+' interested':'this period'}</div></div>
  </div>

  <div class="grid3">
    <div class="kpi"><div class="lbl">Total Sequences</div><div class="val">${c.sequences}</div><div class="sub">in Apollo</div></div>
    <div class="kpi"><div class="lbl">Active Now</div><div class="val" style="color:var(--good)">${c.active}</div><div class="sub">running this month</div></div>
    <div class="kpi"><div class="lbl">Paused</div><div class="val" style="color:var(--muted)">${c.paused}</div><div class="sub">idle / finished</div></div>
  </div>

  <div class="grid2">
    <div class="panel"><h3>Monthly Activity</h3><p class="ph-sub">Emails sent and opened across 2026</p><div class="chartbox"><canvas id="cTrend"></canvas></div></div>
    <div class="panel"><h3>Replies by Month</h3><p class="ph-sub">Positive engagement trend</p><div class="chartbox"><canvas id="cReplies"></canvas></div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>Sequences by Region</h3><p class="ph-sub">Portfolio coverage across markets</p><div class="chartbox"><canvas id="cRegion"></canvas></div></div>
    <div class="panel"><h3>Sequences by Industry</h3><p class="ph-sub">Vertical focus of the portfolio</p><div class="chartbox"><canvas id="cIndustry"></canvas></div></div>
  </div>`;
}
function drawOverview(){
  $('pt').querySelectorAll('button').forEach(b=>b.onclick=()=>{period=b.dataset.p;render('overview');});
  const grid={color:'rgba(36,48,73,.6)'},tick={color:'#8a96b2',font:{size:11}};
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8a96b2',font:{size:11},boxWidth:12}}},
    scales:{x:{grid:{display:false},ticks:tick},y:{grid,ticks:tick,beginAtZero:true}}};
  const t=DATA.trend;
  new Chart($('cTrend'),{type:'bar',data:{labels:t.map(x=>x.m),
    datasets:[{label:'Sent',data:t.map(x=>x.sent),backgroundColor:'#5b8def',borderRadius:5},
      {label:'Opened',data:t.map(x=>x.opened),backgroundColor:'#7c5cff',borderRadius:5}]},options:base});
  new Chart($('cReplies'),{type:'line',data:{labels:t.map(x=>x.m),
    datasets:[{label:'Replies',data:t.map(x=>x.replied),borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.15)',fill:true,tension:.35,pointRadius:3}]},
    options:{...base,plugins:{legend:{display:false}}}});
  // region + industry from sequences count
  const agg=(key)=>{const m={};DATA.sequences.forEach(s=>m[s[key]]=(m[s[key]]||0)+1);
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);};
  const reg=agg('region');
  new Chart($('cRegion'),{type:'bar',data:{labels:reg.map(x=>x[0]),
    datasets:[{label:'Sequences',data:reg.map(x=>x[1]),backgroundColor:'#5b8def',borderRadius:5}]},
    options:{...base,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid,ticks:tick,beginAtZero:true},y:{grid:{display:false},ticks:tick}}}});
  const ind=agg('industry');
  const palette=['#5b8def','#7c5cff','#34d399','#fbbf24','#f87171','#38bdf8','#a78bfa','#fb923c','#4ade80','#e879f9','#94a3b8'];
  new Chart($('cIndustry'),{type:'doughnut',data:{labels:ind.map(x=>x[0]),
    datasets:[{data:ind.map(x=>x[1]),backgroundColor:palette,borderColor:'#131a2b',borderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:'58%',plugins:{legend:{position:'right',labels:{color:'#8a96b2',font:{size:11},boxWidth:11,padding:8}}}}});
}

/* ---------- SEQUENCES ---------- */
function uniq(key){return [...new Set(DATA.sequences.map(s=>s[key]))].sort();}
function seqHTML(){
  const regions=uniq('region'),inds=uniq('industry');
  return `
  <div class="note">ℹ️ <span>Every sequence with its current email step, status, and engagement. Click any column header to sort; use the filters to narrow by market, vertical, or status.</span></div>
  <div class="tablewrap">
    <div class="filters">
      <input id="fSearch" placeholder="Search sequence name…" value="${esc(fSearch)}">
      <select id="fRegion"><option value="">All regions</option>${regions.map(r=>`<option ${fRegion===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
      <select id="fIndustry"><option value="">All industries</option>${inds.map(r=>`<option ${fIndustry===r?'selected':''}>${esc(r)}</option>`).join('')}</select>
      <select id="fStatus"><option value="">All statuses</option><option value="active" ${fStatus==='active'?'selected':''}>Active</option><option value="paused" ${fStatus==='paused'?'selected':''}>Paused</option></select>
      <button class="reset" id="fReset">Reset</button>
      <span class="count" id="rowCount"></span>
    </div>
    <div class="tscroll"><table>
      <thead><tr>
        ${th('name','Sequence')}${th('region','Region')}${th('industry','Industry')}
        ${th('curStep','Current Step')}${th('del','Delivered')}${th('or','Open %')}
        ${th('rep','Replies')}${th('rr','Reply %')}${th('active','Status')}
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table></div>
  </div>`;
}
function th(col,label){
  const on=sortCol===col;
  const arr=on?(sortAsc?'▲':'▼'):'▽';
  const cls=col==='name'||col==='region'||col==='industry'?'':'num';
  return `<th class="${cls} ${on?'sorted':''}" data-col="${col}">${label}<span class="arr">${arr}</span></th>`;
}
function filteredSeqs(){
  let rows=DATA.sequences.filter(s=>{
    if(fRegion&&s.region!==fRegion)return false;
    if(fIndustry&&s.industry!==fIndustry)return false;
    if(fStatus==='active'&&!s.active)return false;
    if(fStatus==='paused'&&s.active)return false;
    if(fSearch&&!s.name.toLowerCase().includes(fSearch.toLowerCase()))return false;
    return true;
  });
  rows.sort((a,b)=>{
    let va=a[sortCol],vb=b[sortCol];
    if(sortCol==='active'){va=a.active?1:0;vb=b.active?1:0;}
    if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();
      return sortAsc?va.localeCompare(vb):vb.localeCompare(va);}
    return sortAsc?va-vb:vb-va;
  });
  return rows;
}
function renderRows(){
  const rows=filteredSeqs();
  $('rowCount').textContent=`${rows.length} of ${DATA.sequences.length} sequences`;
  $('tbody').innerHTML=rows.map(s=>{
    const prog=s.steps>0?Math.round(s.curStep/s.steps*100):0;
    const stLabel=s.stepStatus==='completed'?'Completed':s.stepStatus==='not_started'?'Not started':
      s.stepStatus==='paused'?'Paused':`Step ${s.curStep} of ${s.steps}`;
    const exactMark=s.stepExact?'':'<span class="badge" title="Refreshes with exact per-step counts on the daily run">est</span>';
    return `<tr>
      <td class="seqname">${esc(s.name)}</td>
      <td><span class="pill region">${esc(s.region)}</span></td>
      <td><span class="pill ind">${esc(s.industry)}</span></td>
      <td><div class="prog"><span class="dot ${s.stepStatus}"></span><div class="progbar"><div class="progfill" style="width:${prog}%"></div></div><span class="progtxt">${stLabel}${exactMark}</span></div></td>
      <td class="num">${n(s.del)}</td>
      <td class="num">${s.or?s.or+'%':'—'}</td>
      <td class="num">${n(s.rep)}</td>
      <td class="num">${s.rr?s.rr+'%':'—'}</td>
      <td><span class="pill ${s.active?'active':'paused'}">${s.active?'Active':'Paused'}</span></td>
    </tr>`;
  }).join('');
}
function wireFilters(){
  renderRows();
  $('fSearch').oninput=e=>{fSearch=e.target.value;renderRows();};
  $('fRegion').onchange=e=>{fRegion=e.target.value;renderRows();};
  $('fIndustry').onchange=e=>{fIndustry=e.target.value;renderRows();};
  $('fStatus').onchange=e=>{fStatus=e.target.value;renderRows();};
  $('fReset').onclick=()=>{fRegion=fIndustry=fStatus=fSearch='';render('sequences');};
  document.querySelectorAll('thead th').forEach(th=>{
    th.onclick=()=>{const c=th.dataset.col;
      if(sortCol===c)sortAsc=!sortAsc;else{sortCol=c;sortAsc=(c==='name'||c==='region'||c==='industry');}
      render('sequences');};
  });
}

/* ---------- EMAIL STEPS ---------- */
function stepsHTML(){
  const sp=DATA.step_perf;
  return `
  <div class="note">ℹ️ <span>How each email step in your sequences performs, aggregated across the whole portfolio. Step 1 is the first touch; later steps are follow-ups. Use this to see where engagement drops and which follow-ups are worth keeping.</span></div>
  <div class="grid2">
    <div class="panel"><h3>Open Rate by Step</h3><p class="ph-sub">Where attention fades across the sequence</p><div class="chartbox"><canvas id="cStepOpen"></canvas></div></div>
    <div class="panel"><h3>Replies by Step</h3><p class="ph-sub">Which touch drives the conversation</p><div class="chartbox"><canvas id="cStepRep"></canvas></div></div>
  </div>
  <div class="panel" style="margin-top:16px">
    <h3>Step Breakdown</h3><p class="ph-sub">Sent · opened · clicked · replied per step</p>
    ${sp.map(s=>`
      <div class="steprow">
        <div class="stepnum">${s.step}</div>
        <div class="stepmeta"><div class="n">${esc(s.label)}</div>
          <div class="d">${pct(s.opened,s.sent)} open · ${pct(s.clicked,s.sent)} click · ${pct(s.replied,s.sent)} reply</div></div>
        <div class="stepbars">
          <div class="sb"><div class="v">${n(s.sent)}</div><div class="k">Sent</div></div>
          <div class="sb"><div class="v" style="color:var(--brand2)">${n(s.opened)}</div><div class="k">Opened</div></div>
          <div class="sb"><div class="v" style="color:var(--warn)">${n(s.clicked)}</div><div class="k">Clicked</div></div>
          <div class="sb"><div class="v" style="color:var(--good)">${n(s.replied)}</div><div class="k">Replied</div></div>
        </div>
      </div>`).join('')}
  </div>`;
}
function drawSteps(){
  const sp=DATA.step_perf;
  const grid={color:'rgba(36,48,73,.6)'},tick={color:'#8a96b2',font:{size:11}};
  const base={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
    scales:{x:{grid:{display:false},ticks:tick},y:{grid,ticks:tick,beginAtZero:true}}};
  new Chart($('cStepOpen'),{type:'bar',data:{labels:sp.map(s=>'Step '+s.step),
    datasets:[{data:sp.map(s=>s.sent?+(s.opened/s.sent*100).toFixed(1):0),backgroundColor:'#7c5cff',borderRadius:6}]},
    options:{...base,scales:{...base.scales,y:{...base.scales.y,ticks:{...tick,callback:v=>v+'%'}}}}});
  new Chart($('cStepRep'),{type:'bar',data:{labels:sp.map(s=>'Step '+s.step),
    datasets:[{data:sp.map(s=>s.replied),backgroundColor:'#34d399',borderRadius:6}]},options:base});
}

/* ---------- INSIGHTS ---------- */
function insightsHTML(){
  const i=DATA.insights;
  const subj=i.best_subjects.map((s,x)=>irow(x,esc(s.subject),esc(s.seq)+' · '+n(s.sent)+' sent',s.open_rate+'%','open',x===0,true)).join('');
  const sen=i.best_seniority.map((s,x)=>irow(x,esc(s.name),n(s.sent)+' sent · '+n(s.opened)+' opened',s.replied,'replies',x===0)).join('');
  const seq=i.best_sequence.map((s,x)=>irow(x,esc(s.name),n(s.del)+' delivered · '+(s.or||0)+'% open',s.rep,'replies',x===0)).join('');
  const reg=i.best_region.map((s,x)=>irow(x,esc(s.name),n(s.sent)+' sent · '+n(s.replied)+' replies',s.rr+'%','reply rate',x===0,true)).join('');
  const ind=i.best_industry.map((s,x)=>irow(x,esc(s.name),n(s.sent)+' sent · '+n(s.replied)+' replies',s.rr+'%','reply rate',x===0,true)).join('');
  return `
  <div class="note">ℹ️ <span>Your best-performing messaging, audiences, and markets — computed from Apollo engagement data for 2026. Reply rate is the sharpest quality signal; volume shows reach.</span></div>

  <div class="grid2">
    <div class="insight"><h3>🏆 Best Subject Lines</h3><p class="ih">Highest open rates among sent templates</p><div class="ilist">${subj}</div></div>
    <div class="insight"><h3>👤 Best Audience (Seniority)</h3><p class="ih">Who replies most — target these titles</p><div class="ilist">${sen}</div></div>
  </div>
  <div class="grid2">
    <div class="insight"><h3>🌍 Best Regions</h3><p class="ih">Markets ranked by reply rate</p><div class="ilist">${reg}</div></div>
    <div class="insight"><h3>🏢 Best Industries</h3><p class="ih">Verticals ranked by reply rate</p><div class="ilist">${ind}</div></div>
  </div>
  <div class="insight"><h3>📈 Top Sequences by Replies</h3><p class="ih">Your highest-converting sequences (20+ delivered)</p><div class="ilist">${seq}</div></div>

  <div class="grid2">
    <div class="panel"><h3>Reply Rate: Manual vs Automatic</h3><p class="ph-sub">Manual, personalised emails convert far better</p><div class="chartbox sm"><canvas id="cMsgType"></canvas></div></div>
    <div class="panel"><h3>Pipeline by Contact Stage</h3><p class="ph-sub">Where contacts sit after outreach</p><div class="chartbox sm"><canvas id="cStage"></canvas></div></div>
  </div>`;
}
function irow(idx,title,sub,mv,mk,top,good){
  return `<div class="irow"><div class="rank ${top?'top':''}">${idx+1}</div>
    <div class="main"><div class="t">${title}</div><div class="s">${sub}</div></div>
    <div class="metric ${good?'good':''}"><div class="mv">${mv}</div><div class="mk">${mk}</div></div></div>`;
}
function drawInsights(){
  const i=DATA.insights;
  const grid={color:'rgba(36,48,73,.6)'},tick={color:'#8a96b2',font:{size:11}};
  new Chart($('cMsgType'),{type:'bar',data:{labels:i.msg_type.map(x=>x.type),
    datasets:[{data:i.msg_type.map(x=>x.rr),backgroundColor:['#5b8def','#34d399'],borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{x:{grid:{display:false},ticks:tick},y:{grid,ticks:{...tick,callback:v=>v+'%'},beginAtZero:true}}}});
  const st=i.contact_stages;
  new Chart($('cStage'),{type:'bar',data:{labels:st.map(x=>x.stage),
    datasets:[{label:'Emailed',data:st.map(x=>x.emailed),backgroundColor:'#5b8def',borderRadius:5},
      {label:'Replied',data:st.map(x=>x.replied),backgroundColor:'#34d399',borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,indexAxis:'y',
      plugins:{legend:{labels:{color:'#8a96b2',font:{size:11},boxWidth:12}}},
      scales:{x:{grid,ticks:tick,beginAtZero:true},y:{grid:{display:false},ticks:tick}}}});
}

function footerHTML(){
  return `<footer>DataMasters Customer Intelligence Platform · datamasters.co · Apollo.io · ${esc(DATA.generated_date||'')}</footer>`;
}
